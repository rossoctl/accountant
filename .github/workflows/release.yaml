name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # metrics is a nested module that ci.yaml checks in its own job. Release gates on it too.
  metrics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: metrics/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Tidy
        run: go mod tidy -diff

  release:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is semver
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Tidy
        run: go mod tidy -diff
      - name: Generated cases are current
        run: |
          go generate ./test/cases
          git diff --exit-code -- test/cases
      - name: Warm the Go module proxy (Go's own version rules reject a bad tag before the release exists)
        run: |
          GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org \
            go list -m "github.com/rossoctl/accountant@$GITHUB_REF_NAME"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $flags
