<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">accountant/events: central collection of structural events</title>
<desc id="d">Each user has a laptop. On each laptop an agent, such as Claude Code or Codex, sends its LLM requests through a local proxy: Cortex or the context-guru proxy. The proxy forwards each request to the LLM provider. The proxy holds the accountant and the events module, which turn each request, each keep-alive ping decision and each client lifecycle signal into one structural OpenTelemetry log event. Each proxy exports its events over OTLP/HTTP with TLS and a bearer token to one central deployment, drawn as a dashed frame: one OpenTelemetry Collector and one ClickHouse database. The Collector receives the events, drops unknown attributes (rule E3) and writes them with the clickhouse exporter to one shared ClickHouse database. In the database, the events land in the otel_logs table, materialized views turn them into typed tables, and curated views sit on top. Researchers, each with a read-only account, query the curated views with SQL from clickhouse-client, notebooks or Grafana. The hash key is held by the deployment owner, given to the proxies, and never stored in the database.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
</defs>
<rect width="1160" height="640" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="600" fill="#24292f">accountant/events: central collection of structural events</text>

<!-- The central deployment: one per study -->
<rect x="415" y="104" width="520" height="396" rx="10" fill="#fbfcfd" stroke="#24292f" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="429" y="126" font-size="13" font-weight="600" fill="#24292f">Central deployment</text>
<text x="429" y="143" font-size="12" fill="#57606a">one per study</text>

